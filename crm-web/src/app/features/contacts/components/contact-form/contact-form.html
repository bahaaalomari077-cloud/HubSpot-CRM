@if (mode()) {
  <div class="overlay" (click)="close()">
    <div class="modal" (click)="$event.stopPropagation()" role="dialog">
      <header class="modal-head">
        <h3>{{ isEdit ? 'Edit contact' : 'New contact' }}</h3>
        <button class="modal-x" type="button" (click)="close()" aria-label="Close">×</button>
      </header>

      <div class="modal-body">
        <div class="field-row">
          <label>
            <span class="label">First name *</span>
            <input class="input" type="text" [(ngModel)]="firstName" name="firstName"
                   (keyup.enter)="submit()" />
          </label>
          <label>
            <span class="label">Last name *</span>
            <input class="input" type="text" [(ngModel)]="lastName" name="lastName"
                   (keyup.enter)="submit()" />
          </label>
        </div>

        <div class="field-row">
          <label>
            <span class="label">Email</span>
            <input class="input" type="email" [(ngModel)]="email" name="email" />
          </label>
          <label>
            <span class="label">Phone</span>
            <input class="input" type="text" [(ngModel)]="phone" name="phone" placeholder="962791234567" />
          </label>
        </div>

        <label>
          <span class="label">Position</span>
          <input class="input" type="text" [(ngModel)]="position" name="position" />
        </label>

        <div class="field-row">
          <label>
            <span class="label">Status</span>
            <select class="select" [(ngModel)]="status" name="status">
              @for (s of statuses; track s.value) {
                <option [value]="s.value">{{ s.label }}</option>
              }
            </select>
          </label>
          <label>
            <span class="label">Company</span>
            <select class="select" [(ngModel)]="companyId" name="companyId">
              <option value="">— none —</option>
              @for (c of companies(); track c.id) {
                <option [value]="c.id">{{ c.name }}</option>
              }
            </select>
          </label>
        </div>

        @if (error()) { <p class="note note-error">{{ error() }}</p> }
      </div>

      <footer class="modal-foot">
        <button class="btn" type="button" (click)="close()">Cancel</button>
        <button class="btn btn-primary" type="button"
                [disabled]="invalid || busy()" (click)="submit()">
          {{ busy() ? 'Saving…' : (isEdit ? 'Save changes' : 'Create contact') }}
        </button>
      </footer>
    </div>
  </div>
}
